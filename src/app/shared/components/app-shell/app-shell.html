<div class="layout" [class.layout--sidebar-open]="sidebarOpen()">
  <!-- Backdrop shown behind the drawer on mobile -->
  <div class="layout__overlay" (click)="closeSidebar()"></div>

  <!-- Sidebar navigation -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <img src="/Readquest.png" alt="ReadQuest" class="sidebar__logo" />
      <p class="sidebar__tagline">{{ subtitle() }}</p>
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems(); track item.path) {
        <a
          class="sidebar__link"
          [routerLink]="item.path"
          routerLinkActive="sidebar__link--active"
          (click)="closeSidebar()">
          <app-icon class="sidebar__icon" [name]="item.icon" size="lg" />
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- Main area -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__left">
        <button
          type="button"
          class="topbar__menu"
          (click)="toggleSidebar()"
          aria-label="Toggle menu">
          <app-icon name="menu" size="lg" />
        </button>
        <h1 class="topbar__title">{{ pageTitle() }}</h1>
      </div>

      <div class="topbar__right">
        <div class="topbar__profile">
          <div class="topbar__avatar">
            @if (avatarUrl()) {
              <img [src]="avatarUrl()" [alt]="name()" />
            } @else {
              {{ initials() }}
            }
          </div>
          <p class="topbar__fullname">{{ name() }}</p>
        </div>

        <button type="button" class="topbar__logout" (click)="logout.emit()">
          <app-icon name="logout" size="sm" />
          Log out
        </button>
      </div>
    </header>

    <main class="content">
      <ng-content />
    </main>
  </div>
</div>
