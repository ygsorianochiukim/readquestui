<header class="page-header">
  <div class="page-header__text">
    <h2 class="page-header__title">{{ title() }}</h2>
    @if (subtitle()) {
      <p class="page-header__subtitle">{{ subtitle() }}</p>
    }
  </div>

  <div class="page-header__actions">
    <ng-content select="[actions]" />
  </div>
</header>
