<div class="empty-state">
  <div class="empty-state__icon"><app-icon [name]="icon()" size="2xl" [strokeWidth]="1.5" /></div>
  <h3 class="empty-state__title">{{ title() }}</h3>
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  <div class="empty-state__action">
    <ng-content />
  </div>
</div>
