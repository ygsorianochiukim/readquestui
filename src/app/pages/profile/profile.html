@if (loading()) {
  <app-spinner label="Loading your profile…" />
} @else {
  <app-card>
    <app-alert [message]="errorMessage()" variant="error" />
    <app-alert [message]="successMessage()" variant="success" />

    <div class="avatar">
      <div class="avatar__preview">
        @if (form.profile_image_url) {
          <img [src]="form.profile_image_url" alt="Profile photo" />
        } @else {
          <app-icon name="profile" size="lg" />
        }
      </div>
      <div class="avatar__actions">
        <input #photoInput type="file" accept="image/*" hidden (change)="onPhotoSelected($event)" />
        <app-button
          variant="secondary"
          [disabled]="photoUploading()"
          (clicked)="photoInput.click()">
          {{ photoUploading() ? 'Uploading…' : (form.profile_image_url ? 'Change photo' : 'Upload photo') }}
        </app-button>
        @if (form.profile_image_url) {
          <app-button variant="ghost" (clicked)="removePhoto()">Remove</app-button>
        }
      </div>
    </div>

    <form class="form-grid" (ngSubmit)="save()">
      <app-form-field label="First name">
        <input name="first_name" [(ngModel)]="form.first_name" required />
      </app-form-field>

      <app-form-field label="Last name">
        <input name="last_name" [(ngModel)]="form.last_name" required />
      </app-form-field>

      <app-form-field label="Email">
        <input type="email" name="email" [(ngModel)]="form.email" required />
      </app-form-field>

      <app-form-field label="Phone number">
        <input name="phone_number" [(ngModel)]="form.phone_number" />
      </app-form-field>

      <app-form-field label="New password" hint="Leave blank to keep your current password">
        <input type="password" name="password" [(ngModel)]="form.password" />
      </app-form-field>
    </form>

    <div class="profile__actions">
      <app-button [disabled]="saving()" (clicked)="save()">
        {{ saving() ? 'Saving…' : 'Save Profile' }}
      </app-button>
    </div>
  </app-card>
}
